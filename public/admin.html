
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Sakshi Suit Collection</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #f8f2eb;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 12px 40px #4b183722;
    }
    h1 { color: #4b1837; }
    label { display: block; margin: 18px 0 7px; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d9c7bc;
      border-radius: 7px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #4b1837;
      color: white;
      cursor: pointer;
    }
    #status { overflow-wrap: anywhere; }
    a { color: #4b1837; }
  </style>
</head>
<body>
  <main>
    <p>Sakshi Suit Collection</p>
    <h1>Admin Login</h1>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" autocomplete="username" required maxlength="100">

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required maxlength="200">

      <button id="login-button" type="submit">Login</button>
      <p id="status" role="status"></p>
    </form>
    <a href="/">← Back to store</a>
  </main>

  <script>
    const form = document.querySelector("#login-form");
    const status = document.querySelector("#status");
    const button = document.querySelector("#login-button");

    form.addEventListener("submit", async event => {
      event.preventDefault();
      button.disabled = true;
      status.textContent = "Logging in...";

      try {
        const response = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            username: document.querySelector("#username").value,
            password: document.querySelector("#password").value
          })
        });

        const result = await response.json();

        if (!response.ok) {
          status.textContent = result.error || "Login failed.";
          return;
        }

        window.location.href = "/admin-dashboard.html";
      } catch {
        status.textContent = "Server connection failed. Please try again.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
