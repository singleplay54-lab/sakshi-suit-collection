
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4b1837">
  <title>Admin Login | Sakshi Suit Collection</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f8f2eb;
      padding: 20px;
    }
    .admin-card {
      width: 100%;
      max-width: 420px;
      background: #fffdf9;
      border: 1px solid #ead9cc;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 15px 45px #35132915;
    }
    .admin-card h1 {
      color: #4b1837;
      margin-bottom: 8px;
    }
    .admin-card p { color: #6f625e; }
    .admin-card label {
      display: block;
      margin: 18px 0 7px;
      font-weight: 600;
    }
    .admin-card input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #d9c7bc;
      border-radius: 8px;
      font: inherit;
    }
    .admin-card button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      background: #4b1837;
      color: white;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    #status {
      margin-top: 16px;
      overflow-wrap: anywhere;
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #4b1837;
    }
  </style>
</head>
<body>
  <main class="admin-card">
    <p>Sakshi Suit Collection</p>
    <h1>Admin Login</h1>
    <p>Sign in to manage your store's products.</p>

    <form id="login-form">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        autocomplete="username"
        required
        maxlength="100"
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        maxlength="200"
      >

      <button id="login-button" type="submit">Login securely</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>

    <a class="back-link" href="/">← Back to store</a>
  </main>

  <script>
    const form = document.querySelector("#login-form");
    const status = document.querySelector("#status");
    const button = document.querySelector("#login-button");

    form.addEventListener("submit", async event => {
      event.preventDefault();
      status.textContent = "";
      button.disabled = true;
      button.textContent = "Signing in...";

      try {
        const response = await fetch("/api/admin/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: form.username.value,
            password: form.password.value
          })
        });

        const result = await response.json();

        if (!response.ok) {
          status.textContent = result.error || "Login failed.";
          return;
        }

        window.location.href = "/admin-dashboard.html";
      } catch {
        status.textContent = "Server se connection nahi ho paaya. Please try again.";
      } finally {
        button.disabled = false;
        button.textContent = "Login securely";
      }
    });
  </script>
</body>
</html>
